[package]
name = "phyniqs-desktop"
version = "0.1.0"
description = "Phyniqs native typography auditor"
authors = ["Phyniqs Global"]
edition = "2021"

[lib]
name = "phyniqs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
